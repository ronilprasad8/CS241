<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Administrative System | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        .role-indicator {
            position: absolute;
            top: -12px;
            right: 20px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
        }
        .floating-label {
            position: absolute;
            pointer-events: none;
            left: 12px;
            top: 12px;
            transition: 0.2s ease all;
            color: #9ca3af;
            font-size: 14px;
        }
        input:focus ~ .floating-label,
        input:not(:placeholder-shown) ~ .floating-label,
        select:focus ~ .floating-label,
        select:not([value=""]) ~ .floating-label {
            top: -8px;
            left: 10px;
            font-size: 12px;
            background: white;
            padding: 0 4px;
            color: #3b82f6;
        }
        .floating-label-active {
            top: -8px;
            left: 10px;
            font-size: 12px;
            background: white;
            padding: 0 4px;
            color: #3b82f6;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo and School Name -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <div class="bg-white p-3 rounded-full shadow-lg">
                    <i class="fas fa-graduation-cap text-3xl text-blue-600"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-white">Nadi Muslim College</h1>
            <p class="text-blue-100 mt-1">Student Administrative System</p>
        </div>

        <!-- Login Tab Only -->
        <div class="bg-white rounded-t-lg overflow-hidden">
            <div class="flex border-b">
                <button id="login-tab" class="flex-1 py-4 px-6 text-center font-medium tab-active">Login</button>
            </div>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="bg-white rounded-b-lg p-8 card-shadow">
            <form th:action="@{/login}" method="post">
                <div class="relative mb-6">
                    <input type="text" name="username" id="login-username" class="w-full px-4 py-3 border rounded-lg input-focus" placeholder=" " required>
                    <label for="login-username" class="floating-label">Username</label>
                    <div id="login-role" class="role-indicator bg-blue-100 text-blue-800 hidden"></div>
                </div>

                <div class="relative mb-6">
                    <input type="password" name="password" id="login-password" class="w-full px-4 py-3 border rounded-lg input-focus" placeholder=" " required>
                    <label for="login-password" class="floating-label">Password</label>
                    <button type="button" id="toggle-password" class="absolute right-3 top-3 text-gray-400">
                        <i class="far fa-eye"></i>
                    </button>
                </div>

                <div class="flex items-center mb-6">
                    <input type="checkbox" id="remember-me" name="remember-me" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
                </div>

                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Login
                </button>

                <!-- Signup link removed -->

                <!-- Error Messages -->
                <div th:if="${param.error}" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    Invalid username or password
                </div>
                <div th:if="${param.logout}" class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
                    You have been logged out successfully
                </div>
                <div th:if="${param.success}" class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
                    Account created successfully! Please login.
                </div>
            </form>


        </div>

        <!-- Signup form removed -->
    </div>

    <script>
        // DOM Elements
        const loginTab = document.getElementById('login-tab');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const togglePassword = document.getElementById('toggle-password');
        const loginPassword = document.getElementById('login-password');
        const loginUsername = document.getElementById('login-username');
        const loginRole = document.getElementById('login-role');

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPassword.setAttribute('type', type);
            togglePassword.innerHTML = type === 'password' ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
        });

        // Detect role based on username input
        function detectRole(username) {
            if (!username) return null;

            // Map demo users to roles
            const roleMap = {
                'admin': { role: 'Admin', color: 'bg-red-100', text: 'text-red-800' },
                'teacher1': { role: 'Teacher', color: 'bg-purple-100', text: 'text-purple-800' },
                'student1': { role: 'Student', color: 'bg-green-100', text: 'text-green-800' }
            };

            return roleMap[username.toLowerCase()] || null;
        }

        // Update role indicator for login
        loginUsername.addEventListener('input', () => {
            const role = detectRole(loginUsername.value);
            if (role) {
                loginRole.textContent = role.role;
                loginRole.className = `role-indicator ${role.color} ${role.text}`;
                loginRole.classList.remove('hidden');
            } else {
                loginRole.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
