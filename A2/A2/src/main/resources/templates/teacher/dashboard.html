<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/teacher-sidebar :: sidebar}"></div>

    <div class="flex-1 p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Welcome, Teacher!</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="/teacher/attendance" class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Manage Attendance</h3>
                <div class="h-40 bg-blue-100 rounded-md flex items-center justify-center">
                    <i class="fas fa-user-check text-4xl text-blue-500"></i>
                </div>
            </a>
            <a href="/teacher/grades" class="bg-white rounded-lg shadow-lg p-6 hover:shadow-xl transition-shadow">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Enter Grades</h3>
                <div class="h-40 bg-green-100 rounded-md flex items-center justify-center">
                    <i class="fas fa-marker text-4xl text-green-500"></i>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
