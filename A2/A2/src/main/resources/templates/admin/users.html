<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">User Management</h1>
            <a th:href="@{/admin/users/add}" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg flex items-center">
                <i class="fas fa-plus mr-2"></i> Add New User
            </a>
        </div>

        <div class="border-b border-gray-200 mb-6">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <a th:href="@{/admin/users(type='TEACHER')}"
                   th:classappend="${activeTab == 'TEACHER'} ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                   class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                    Teachers
                </a>
                <a th:href="@{/admin/users(type='STUDENT')}"
                   th:classappend="${activeTab == 'STUDENT'} ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                   class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                    Students
                </a>
            </nav>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="border border-gray-200 rounded-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="p-4 font-medium">Name</th>
                        <th class="p-4 font-medium">Username</th>
                        <th class="p-4 font-medium">Role</th>
                        <th class="p-4 font-medium">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}" class="border-t border-gray-200">
                        <td class="p-4" th:text="${user.firstName + ' ' + user.lastName}"></td>
                        <td class="p-4" th:text="${user.username}"></td>
                        <td class="p-4">
                               <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                     th:text="${user.userType.name()}"
                                     th:classappend="${user.userType.name() == 'TEACHER'} ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'">
                               </span>
                        </td>
                        <td class="p-4">
                            <a th:if="${user.userType.name() == 'STUDENT'}" th:href="@{/admin/students/edit/{id}(id=${user.id})}" class="text-yellow-600 hover:text-yellow-800 text-sm font-semibold">Edit</a>
                            <a th:if="${user.userType.name() == 'TEACHER'}" th:href="@{/admin/teachers/edit/{id}(id=${user.id})}" class="text-yellow-600 hover:text-yellow-800 text-sm font-semibold">Edit</a>
                            <form th:if="${user.userType.name() == 'STUDENT'}" th:action="@{/admin/students/delete/{id}(id=${user.id})}" method="post" class="inline ml-4">
                                <button type="submit"
                                        class="text-red-600 hover:text-red-800 text-sm font-semibold"
                                        onclick="return confirm('Are you sure you want to delete this student?');">
                                    Delete
                                </button>
                            </form>
                            <form th:if="${user.userType.name() == 'TEACHER'}" th:action="@{/admin/teachers/delete/{id}(id=${user.id})}" method="post" class="inline ml-4">
                                <button type="submit"
                                        class="text-red-600 hover:text-red-800 text-sm font-semibold"
                                        onclick="return confirm('Are you sure you want to delete this teacher?');">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
