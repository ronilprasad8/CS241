<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Teacher</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Edit Teacher</h1>

        <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${errorMessage}"></span>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-8 max-w-4xl mx-auto">
            <form th:action="@{/admin/teachers/update}" th:object="${userForm}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{userType}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label for="firstName" class="block text-gray-700 text-sm font-bold mb-2">First Name *</label><input type="text" th:field="*{firstName}" id="firstName" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="lastName" class="block text-gray-700 text-sm font-bold mb-2">Last Name *</label><input type="text" th:field="*{lastName}" id="lastName" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username *</label><input type="text" th:field="*{username}" id="username" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password (leave blank to keep current)</label><input type="password" th:field="*{password}" id="password" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="dateOfBirth" class="block text-gray-700 text-sm font-bold mb-2">Date of Birth</label><input type="date" th:field="*{dateOfBirth}" id="dateOfBirth" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="gender" class="block text-gray-700 text-sm font-bold mb-2">Gender</label><select th:field="*{gender}" id="gender" class="shadow-sm border rounded w-full py-2 px-3"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                    <div><label for="address" class="block text-gray-700 text-sm font-bold mb-2">Address</label><input type="text" th:field="*{address}" id="address" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="contactNumber" class="block text-gray-700 text-sm font-bold mb-2">Contact Number</label><input type="text" th:field="*{contactNumber}" id="contactNumber" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div class="md:col-span-2"><label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label><input type="email" th:field="*{email}" id="email" class="shadow-sm border rounded w-full py-2 px-3"></div>
                </div>

                <div class="mt-6 border-t pt-6">
                    <h3 class="text-xl font-semibold mb-4 text-gray-700">Teacher Details</h3>
                    <div><label for="qualifications" class="block text-gray-700 text-sm font-bold mb-2">Qualifications</label><input type="text" th:field="*{qualifications}" id="qualifications" class="shadow-sm border rounded w-full py-2 px-3"></div>
                </div>

                <div class="mt-8 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Update Teacher</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
