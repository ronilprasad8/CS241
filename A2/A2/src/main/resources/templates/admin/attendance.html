<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Attendance Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div class="w-64 bg-gray-800 text-white flex flex-col">
        <div class="px-8 py-6 border-b border-gray-700">
            <h1 class="text-xl font-bold">Admin Panel</h1>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-2">
            <a href="/admin/dashboard" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
            </a>
            <a href="/admin/attendance" class="flex items-center px-4 py-2 text-white bg-gray-900 rounded-md">
                <i class="fas fa-user-check mr-3"></i> Attendance Log
            </a>
        </nav>
        <div class="px-8 py-6 border-t border-gray-700">
            <a th:href="@{/logout}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 rounded-md">
                <i class="fas fa-sign-out-alt mr-3"></i> Logout
            </a>
        </div>
    </div>

    <div class="flex-1 p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Full Attendance Log</h1>
        <div class="bg-white rounded-lg shadow-lg p-6">
            <table class="w-full text-left">
                <thead>
                <tr class="border-b">
                    <th class="py-2">Date</th>
                    <th class="py-2">Student Name</th>
                    <th class="py-2">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${allRecords}" class="border-b">
                    <td class="py-4" th:text="${record.date}"></td>
                    <td class="py-4" th:text="${record.student.firstName + ' ' + record.student.lastName}"></td>
                    <td class="py-4">
                         <span th:text="${record.status}"
                               th:classappend="${record.status.name() == 'PRESENT'} ? 'text-green-600' : (${record.status.name() == 'ABSENT'} ? 'text-red-600' : 'text-yellow-600')"
                               class="font-semibold">
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(allRecords)}">
                    <td colspan="3" class="py-4 text-gray-500">No attendance records found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
