<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Year Manager Assigned</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="flex-1 flex items-center justify-center p-8">
        <div class="bg-white p-8 rounded-lg shadow-md text-center max-w-md w-full">
            <div class="text-green-500 mb-4">
                <i class="fas fa-check-circle text-6xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Year Manager Successfully Assigned</h1>
            <p class="text-gray-600 mb-6" th:text="${successMessage}"></p>

            <div class="flex space-x-4 justify-center">
                <a th:href="@{/admin/dashboard}" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">
                    Go to Dashboard
                </a>
                <a th:href="@{/admin/classes/assign-teacher}" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">
                    Assign New Year Manager
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
