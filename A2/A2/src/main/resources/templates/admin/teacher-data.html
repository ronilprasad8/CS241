<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Teacher Data Management</h1>

        <div class="bg-white p-4 rounded-lg shadow-md mb-6">
            <form th:action="@{/admin/teachers}" method="get" class="flex items-center space-x-4">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute top-3 left-3 text-gray-400"></i>
                    <input type="text" name="searchTerm" placeholder="Enter teacher name or ID..." th:value="${searchTerm}"
                           class="pl-10 pr-4 py-2 border rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <select name="subjectId" class="border rounded-lg py-2 px-3 focus:outline-none">
                    <option value="">Filter by Subject</option>
                    <option th:each="subject : ${subjects}"
                            th:value="${subject.id}"
                            th:text="${subject.subjectName + ' (Year ' + subject.yearLevel + ')'}"
                            th:selected="${subject.id == selectedSubjectId}"></option>
                </select>

                <button type="submit" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg">Filter</button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h3 class="text-lg font-semibold mb-4" th:text="|Found ${teachers.size()} teacher(s)|"></h3>
            <div class="border border-gray-200 rounded-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="p-4 font-medium">Name</th>
                        <th class="p-4 font-medium">Username / ID</th>
                        <th class="p-4 font-medium">Contact</th>
                    <th class="p-4 font-medium">Qualifications</th>
                    <th class="p-4 font-medium">Assigned Subjects</th>
                    <th class="p-4 font-medium">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="teacher : ${teachers}" class="border-t border-gray-200">
                    <td class="p-4" th:text="${teacher.firstName + ' ' + teacher.lastName}"></td>
                    <td class="p-4" th:text="${teacher.username}"></td>
                    <td class="p-4" th:text="${teacher.contactNumber}"></td>
                    <td class="p-4" th:text="${teacher.qualifications}"></td>
                    <td class="p-4">
                        <ul>
                            <li th:each="subject : ${teacherSubjects[teacher.id]}" th:text="${subject.subjectName + ' (Year ' + subject.yearLevel + ')'}"></li>
                        </ul>
                    </td>
                    <td class="p-4">
                        <a th:href="@{/admin/teachers/edit/{id}(id=${teacher.id})}" class="text-yellow-600 hover:text-yellow-800 text-sm font-semibold">Edit</a>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
