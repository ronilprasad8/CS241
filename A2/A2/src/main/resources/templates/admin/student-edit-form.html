<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Edit Student</h1>

        <div th:if="${successMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${errorMessage}"></span>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-8 max-w-4xl mx-auto">
            <form th:action="@{/admin/students/update}" th:object="${userForm}" method="post" class="space-y-6">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{userType}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label for="firstName" class="block text-gray-700 text-sm font-bold mb-2">First Name *</label><input type="text" th:field="*{firstName}" id="firstName" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="lastName" class="block text-gray-700 text-sm font-bold mb-2">Last Name *</label><input type="text" th:field="*{lastName}" id="lastName" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username *</label><input type="text" th:field="*{username}" id="username" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password (leave blank to keep current)</label><input type="password" th:field="*{password}" id="password" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="dateOfBirth" class="block text-gray-700 text-sm font-bold mb-2">Date of Birth</label><input type="date" th:field="*{dateOfBirth}" id="dateOfBirth" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="gender" class="block text-gray-700 text-sm font-bold mb-2">Gender</label><select th:field="*{gender}" id="gender" class="shadow-sm border rounded w-full py-2 px-3"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option></select></div>
                    <div><label for="address" class="block text-gray-700 text-sm font-bold mb-2">Address</label><input type="text" th:field="*{address}" id="address" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div><label for="contactNumber" class="block text-gray-700 text-sm font-bold mb-2">Contact Number</label><input type="text" th:field="*{contactNumber}" id="contactNumber" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    <div class="md:col-span-2"><label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label><input type="email" th:field="*{email}" id="email" class="shadow-sm border rounded w-full py-2 px-3"></div>
                </div>

                <div class="mt-6 border-t pt-6">
                    <h3 class="text-xl font-semibold mb-4 text-gray-700">Student Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label for="indexNumber" class="block text-gray-700 text-sm font-bold mb-2">Index Number *</label><input type="number" th:field="*{indexNumber}" id="indexNumber" required class="shadow-sm border rounded w-full py-2 px-3"></div>
                        <div><label for="yearLevel" class="block text-gray-700 text-sm font-bold mb-2">Year *</label><select th:field="*{yearLevel}" id="yearLevel" class="shadow-sm border rounded w-full py-2 px-3"><option value="">Select Year</option><option th:each="entry : ${yearStreamMap}" th:value="${entry.key}" th:text="${entry.key}"></option></select></div>
                        <div><label for="streamName" class="block text-gray-700 text-sm font-bold mb-2">Stream *</label><select th:field="*{streamName}" id="streamName" class="shadow-sm border rounded w-full py-2 px-3" disabled><option value="">Select Year First</option></select></div>
                        <div><label for="citizenship" class="block text-gray-700 text-sm font-bold mb-2">Citizenship</label><input type="text" th:field="*{citizenship}" id="citizenship" class="shadow-sm border rounded w-full py-2 px-3"></div>
                        <div><label for="parentGuardian" class="block text-gray-700 text-sm font-bold mb-2">Parent/Guardian</label><input type="text" th:field="*{parentGuardian}" id="parentGuardian" class="shadow-sm border rounded w-full py-2 px-3"></div>
                    </div>
                    <div id="subject-selection" class="mt-6"></div>
                </div>

                <div class="mt-8 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Update Student</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const yearStreamMap = /*[[${yearStreamMap}]]*/ {};
    const subjectsByYear = /*[[${subjectsByYear}]]*/ {};
    const selectedSubjectIds = /*[[${userForm.subjectIds != null ? userForm.subjectIds : []}]]*/ [];

    const yearLevelSelect = document.getElementById('yearLevel');
    const streamSelect = document.getElementById('streamName');
    const subjectSelectionDiv = document.getElementById('subject-selection');

    function populateSubjects(year) {
        subjectSelectionDiv.innerHTML = '';
        if (year && subjectsByYear[year]) {
            const subjects = subjectsByYear[year];
            let html = '<h4 class="text-lg font-semibold mb-2 border-t pt-4">Subject Selection</h4>';

            if (subjects.COMPULSORY) {
                html += '<div class="my-3"><h5 class="font-bold">Compulsory (Auto-Enrolled)</h5>';
                subjects.COMPULSORY.forEach(s => {
                    const isChecked = selectedSubjectIds.includes(s.id);
                    html += `<label class="inline-flex items-center mr-4"><input type="checkbox" name="subjectIds" value="${s.id}" ${isChecked ? 'checked' : ''} class="mr-2">${s.subjectName}</label>`;
                });
                html += '</div>';
            }
            if (subjects.ELECTIVE) {
                html += '<div class="my-3"><h5 class="font-bold">Electives</h5>';
                subjects.ELECTIVE.forEach(s => {
                    const isChecked = selectedSubjectIds.includes(s.id);
                    html += `<label class="inline-flex items-center mr-4"><input type="checkbox" name="subjectIds" value="${s.id}" ${isChecked ? 'checked' : ''} class="mr-2">${s.subjectName}</label>`;
                });
                html += '</div>';
            }
            if (subjects.LANGUAGE) {
                html += '<div class="my-3"><h5 class="font-bold">Languages</h5>';
                subjects.LANGUAGE.forEach(s => {
                    const isChecked = selectedSubjectIds.includes(s.id);
                    html += `<label class="inline-flex items-center mr-4"><input type="checkbox" name="subjectIds" value="${s.id}" ${isChecked ? 'checked' : ''} class="mr-2">${s.subjectName}</label>`;
                });
                html += '</div>';
            }
            subjectSelectionDiv.innerHTML = html;
        }
    }

    function populateStreams(year) {
        const currentValue = streamSelect.value;
        streamSelect.innerHTML = '<option value="">Select Stream</option>';
        if (year && yearStreamMap[year]) {
            streamSelect.disabled = false;
            yearStreamMap[year].forEach(stream => {
                const option = document.createElement('option');
                option.value = stream;
                option.text = stream;
                if (stream === currentValue) {
                    option.selected = true;
                }
                streamSelect.appendChild(option);
            });
        } else {
            streamSelect.disabled = true;
        }
    }

    if (yearLevelSelect) {
        // Populate streams and subjects on load if year is selected
        const initialYear = yearLevelSelect.value;
        if (initialYear) {
            populateStreams(initialYear);
            populateSubjects(initialYear);

            // Enable stream dropdown on page load if year is selected
            streamSelect.disabled = false;

            // Select the current stream in the dropdown
            const currentStream = /*[[${userForm.streamName}]]*/ '';
            if (currentStream) {
                const streamOptions = streamSelect.options;
                for (let i = 0; i < streamOptions.length; i++) {
                    if (streamOptions[i].value === currentStream) {
                        streamOptions[i].selected = true;
                        break;
                    }
                }
            }
        }

        yearLevelSelect.addEventListener('change', () => {
            const year = yearLevelSelect.value;

            // Populate Stream dropdown
            populateStreams(year);

            // Populate Subject checkboxes
            populateSubjects(year);
        });
    }
    /*]]>*/
</script>
</body>
</html>
