<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/student-sidebar :: sidebar}"></div>

    <div class="flex-1 p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">My Attendance Report</h1>

        <!-- Month Navigation -->
        <div class="mb-6 flex items-center justify-between">
            <button id="prevMonth" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l">
                < Previous Month
            </button>
            <h2 class="text-2xl font-semibold text-gray-700" th:text="${#dates.format(#dates.create(currentYear, currentMonth-1, 1), 'MMMM yyyy')}">Current Month</h2>
            <button id="nextMonth" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-r">
                Next Month >
            </button>
        </div>

        <!-- Calendar Grid -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="grid grid-cols-7 gap-2 mb-4">
                <div class="text-center font-semibold text-gray-600">Sun</div>
                <div class="text-center font-semibold text-gray-600">Mon</div>
                <div class="text-center font-semibold text-gray-600">Tue</div>
                <div class="text-center font-semibold text-gray-600">Wed</div>
                <div class="text-center font-semibold text-gray-600">Thu</div>
                <div class="text-center font-semibold text-gray-600">Fri</div>
                <div class="text-center font-semibold text-gray-600">Sat</div>
            </div>

            <div class="grid grid-cols-7 gap-2">
                <!-- Calendar days will be generated by JavaScript -->
            </div>
        </div>

        <!-- Statistics Summary -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Monthly Summary</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-600" th:text="${totalDays}">0</div>
                    <div class="text-sm text-gray-600">Total Days</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-red-600" th:text="${absentDays}">0</div>
                    <div class="text-sm text-gray-600">Days Absent</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-yellow-600" th:text="${lateDays}">0</div>
                    <div class="text-sm text-gray-600">Days Late</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-600" th:text="${attendancePercentage + '%'}">0%</div>
                    <div class="text-sm text-gray-600">Attendance Rate</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const currentYear = [[${currentYear}]];
    const currentMonth = [[${currentMonth}]];
    const attendanceRecords = /*[[${attendanceRecords}]]*/ [];

    // Create a map of date to status for quick lookup
    const attendanceMap = {};
    attendanceRecords.forEach(record => {
        const date = new Date(record.date);
        const day = date.getDate();
        attendanceMap[day] = record.status;
    });

    function getStatusColor(status) {
        switch(status) {
            case 'PRESENT': return 'bg-green-500';
            case 'ABSENT': return 'bg-red-500';
            case 'LATE': return 'bg-yellow-500';
            case 'EXCUSED': return 'bg-gray-500';
            default: return 'bg-gray-200';
        }
    }

    function getStatusText(status) {
        switch(status) {
            case 'PRESENT': return 'Present';
            case 'ABSENT': return 'Absent';
            case 'LATE': return 'Late';
            case 'EXCUSED': return 'Excused';
            default: return 'No Record';
        }
    }

    function generateCalendar() {
        const calendarGrid = document.querySelector('.grid.grid-cols-7.gap-2:last-child');
        calendarGrid.innerHTML = '';

        const firstDay = new Date(currentYear, currentMonth - 1, 1);
        const lastDay = new Date(currentYear, currentMonth, 0);
        const startDate = new Date(firstDay);
        startDate.setDate(startDate.getDate() - firstDay.getDay());

        for (let i = 0; i < 42; i++) {
            const currentDate = new Date(startDate);
            currentDate.setDate(startDate.getDate() + i);

            const dayElement = document.createElement('div');
            dayElement.className = 'h-12 flex items-center justify-center rounded cursor-pointer hover:opacity-80 transition-opacity';

            if (currentDate.getMonth() === currentMonth - 1) {
                const day = currentDate.getDate();
                const dayOfWeek = currentDate.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
                const status = attendanceMap[day] || 'PRESENT'; // Default to PRESENT if no record

                // Apply base status color
                dayElement.className += ' ' + getStatusColor(status);
                dayElement.textContent = day;
                dayElement.title = getStatusText(status);

                // Add shading for weekends
                if (dayOfWeek === 0 || dayOfWeek === 6) { // Sunday = 0, Saturday = 6
                    dayElement.className += ' opacity-60'; // Add shading for weekends
                }
            } else {
                dayElement.className += ' bg-gray-100 text-gray-400';
                dayElement.textContent = currentDate.getDate();
            }

            calendarGrid.appendChild(dayElement);
        }
    }

    function changeMonth(direction) {
        let newYear = currentYear;
        let newMonth = currentMonth + direction;

        if (newMonth < 1) {
            newMonth = 12;
            newYear--;
        } else if (newMonth > 12) {
            newMonth = 1;
            newYear++;
        }

        window.location.href = `/student/attendance?year=${newYear}&month=${newMonth}`;
    }

    document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));

    generateCalendar();
</script>

</body>
</html>
