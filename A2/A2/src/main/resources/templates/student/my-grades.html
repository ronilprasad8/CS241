<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Grades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body class="bg-gray-100">
<div class="flex h-screen">
    <div th:replace="~{fragments/student-sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">My Grades Report</h1>

        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="border border-gray-200 rounded-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-4 font-medium">Subject</th>
                            <th class="p-4 font-medium">Teacher</th>
                            <th class="p-4 font-medium text-center">Exam Type</th>
                            <th class="p-4 font-medium text-center">Marks</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="enrollment : ${enrollments}" class="border-t border-gray-200">
                            <td class="p-4" th:text="${enrollment.subject.subjectName}"></td>
                            <td class="p-4" th:text="${enrollment.subject.teacher?.firstName + ' ' + enrollment.subject.teacher?.lastName}"></td>
                            <td class="p-4 text-center" th:text="${enrollment.examType}"></td>
                            <td class="p-4 text-center">
                                <span class="font-bold text-lg" th:if="${enrollment.marksGained != null and enrollment.totalMarks != null}" th:text="${enrollment.marksGained + '/' + enrollment.totalMarks}"></span>
                                <span class="text-gray-500" th:if="${enrollment.marksGained == null or enrollment.totalMarks == null}">Not graded</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(enrollments)}">
                            <td colspan="4" class="p-4 text-center text-gray-500">You are not enrolled in any subjects yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
