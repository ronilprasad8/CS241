<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar" class="w-64 bg-gray-800 text-white flex flex-col">
    <div class="px-8 py-6 border-b border-gray-700">
        <h1 class="text-xl font-bold">Admin Panel</h1>
    </div>
    <nav class="flex-1 px-4 py-4 space-y-2">
        <a th:href="@{/admin/dashboard}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
            <i class="fas fa-tachometer-alt mr-3 w-5 text-center"></i> Dashboard
        </a>
        <a th:href="@{/admin/users}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
            <i class="fas fa-users-cog mr-3 w-5 text-center"></i> User Management
        </a>
        <a th:href="@{/admin/students}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
            <i class="fas fa-user-graduate mr-3 w-5 text-center"></i> Student Data
        </a>
        <a th:href="@{/admin/teachers}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
            <i class="fas fa-chalkboard-teacher mr-3 w-5 text-center"></i> Teacher Data
        </a>
        <div class="space-y-1">
            <div class="px-4 py-2 text-gray-400 text-sm font-semibold">Manage Classes</div>
            <a th:href="@{/admin/subjects/assign}" class="flex items-center px-6 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md text-sm">
                <i class="fas fa-link mr-3 w-4 text-center"></i> Assign Subject
            </a>
            <a th:href="@{/admin/classes/assign-teacher}" class="flex items-center px-6 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md text-sm">
                <i class="fas fa-user-tie mr-3 w-4 text-center"></i> Assign Year Manager
            </a>
        </div>
    </nav>
    <div class="px-8 py-6 border-t border-gray-700">
        <a th:href="@{/logout}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
            <i class="fas fa-sign-out-alt mr-3 w-5 text-center"></i> Logout
        </a>
    </div>
</div>

</body>
</html>
