<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-900">Reset Password</h1>
        <form th:action="${actionUrl}" method="post" class="space-y-4">
            <input type="hidden" name="username" th:value="${username}" />
            <div>
                <label class="block text-gray-700">New Password</label>
                <input type="password" name="password" class="w-full px-4 py-2 border rounded-lg" required />
            </div>
            <div>
                <label class="block text-gray-700">Confirm Password</label>
                <input type="password" name="confirmPassword" class="w-full px-4 py-2 border rounded-lg" required />
            </div>
            <div class="flex justify-between mt-6">
                <a href="/login" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Cancel</a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Reset Password</button>
            </div>
        </form>
        <div th:if="${error}" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded" th:text="${error}"></div>
        <div th:if="${success}" class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
            <span th:text="${success}"></span>
        </div>
    </div>
</body>
</html>
